version: '3.8'

services:
  # 🐘 PostgreSQL + PostGIS (Geolokatsiya bazasi)
  db:
    image: postgis/postgis:16-3.4
    container_name: tuyxona_postgres
    restart: always
    environment:
      POSTGRES_DB: tuyxona_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ Redis 7 (Kesh, Double-booking lock, WebSockets)
  redis:
    image: redis:7-alpine
    container_name: tuyxona_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🚀 Asinxron Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuyxona_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_secret_password@db:5432/tuyxona_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ENTERPRISE_SECRET_KEY_FOR_TUYXONA_PROD
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
