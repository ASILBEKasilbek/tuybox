{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ profile.user.username }} profili</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

    <style>
        /* belgilarni markazga chiqarish */
        .fc-daygrid-event {
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>{{ profile.user.username }} profili</h1>

    {% if profile.is_provider %}
        <h2>Xizmatlar</h2>
        {% for service in services %}
            <div style="border:1px solid #ccc; margin-bottom:20px; padding:10px;">
                <h3>{{ service.title }}</h3>
                <p>{{ service.description }}</p>

                <div id="calendar-{{ service.id }}"></div>

                <script>
                document.addEventListener('DOMContentLoaded', function() {
                    var calendarEl = document.getElementById('calendar-{{ service.id }}');
                    var calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: 'dayGridMonth',
                        events: "{% url 'service_calendar_events' service.id %}",
                        eventContent: function(arg) {
                            return { html: '<span>' + arg.event.title + '</span>' };
                        }
                    });
                    calendar.render();
                });
                </script>
            </div>
        {% endfor %}
    {% endif %}
</body>
</html>
